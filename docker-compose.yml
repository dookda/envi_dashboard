version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: envi_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: envi_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d envi_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: ./web
    container_name: envi_web
    restart: always
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      # Override DATABASE_URL from .env — container uses Docker network, not localhost
      DATABASE_URL: postgresql://postgres:postgres@db:5432/envi_db
      AUTH_TRUST_HOST: "true"
      AUTH_URL: ${APP_HOST}${APP_BASE_PATH}/api/auth
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN}
      LIFF_ID_DASHBOARD: ${LIFF_ID_DASHBOARD}
      LIFF_ID_ACCOUNT: ${LIFF_ID_ACCOUNT}
      LIFF_ID_ADMIN: ${LIFF_ID_ADMIN}
      APP_KEY: ${APP_KEY}
      APP_SECRET: ${APP_SECRET}
    depends_on:
      db:
        condition: service_healthy

  cron:
    image: alpine:3.19
    container_name: envi_cron
    restart: always
    depends_on:
      web:
        condition: service_started
    command: >
      sh -c "echo 'Cron started — syncing every 60s'; while true; do
        wget -qO- --header='Content-Type: application/json' --post-data='{}' http://web:3000/air/api/readings/sync && echo ' synced' || echo ' sync failed';
        sleep 60;
      done"

volumes:
  postgres_data:
